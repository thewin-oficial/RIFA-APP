<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma de Rifa en Tiempo Real</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #f4f4f9; margin: 0; padding: 20px; }
        h1 { color: #333; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(60px, 1fr)); gap: 8px; max-width: 900px; margin: 20px auto; max-height: 380px; overflow-y: auto; padding: 15px; background: white; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .ticket { padding: 10px; background: #e0e0e0; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .ticket.seleccionado { background: #ff9800; color: white; }
        .ticket.vendido { background: #f44336; color: white; cursor: not-allowed; }
        .formulario-compra { max-width: 400px; margin: 20px auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: flex; flex-direction: column; gap: 10px; }
        .formulario-compra input { padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
        #comprar-btn { padding: 12px 24px; background: #4CAF50; color: white; border: none; font-size: 16px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        #comprar-btn:hover { background: #45a049; }
    </style>
</head>
<body>

    <h1>Rifa en Tiempo Real</h1>
    <p>Selecciona tus boletos disponibles (1 al 7000):</p>
    
    <div id="grid-boletos" class="grid"></div>
    
    <div class="formulario-compra">
        <h3>Datos del Comprador</h3>
        <input type="text" id="nombre-comprador" placeholder="Nombre completo" required>
        <input type="tel" id="telefono-comprador" placeholder="Teléfono / WhatsApp" required>
        <button id="comprar-btn" onclick="comprarBoletos()">Confirmar Compra</button>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

        const SUPABASE_URL = 'https://eqiawpjzztwbuxkvcyqr.supabase.co';
        const SUPABASE_KEY = 'TU_CLAVE_ANON_AQUÍ'; // Pega aquí tu clave anon public

        const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

        let boletosVendidos = [];
        let listaCompradores = [];
        let seleccionados = [];

        const grid = document.getElementById('grid-boletos');

        function generarBoletos() {
            grid.innerHTML = '';
            for (let i = 1; i <= 7000; i++) {
                const btn = document.createElement('button');
                btn.classList.add('ticket');
                btn.textContent = i;
                btn.id = `ticket-${i}`;

                if (boletosVendidos.includes(i)) {
                    btn.classList.add('vendido');
                    btn.disabled = true;
                } else {
                    if (seleccionados.includes(i)) {
                        btn.classList.add('seleccionado');
                    }
                    btn.onclick = () => alternarSeleccion(i, btn);
                }
                grid.appendChild(btn);
            }
        }

        function alternarSeleccion(num, btn) {
            const index = seleccionados.indexOf(num);
            if (index > -1) {
                seleccionados.splice(index, 1);
                btn.classList.remove('seleccionado');
            } else {
                seleccionados.push(num);
                btn.classList.add('seleccionado');
            }
        }

        async function cargarDatos() {
            const { data, error } = await supabase
                .from('rifa_datos')
                .select('vendidos, compradores')
                .eq('id', 1)
                .single();

            if (error) {
                console.error('Error al cargar datos:', error);
                return;
            }

            if (data) {
                boletosVendidos = data.vendidos || [];
                listaCompradores = data.compradores || [];
                generarBoletos();
            }
        }

        window.comprarBoletos = async function() {
            const nombre = document.getElementById('nombre-comprador').value.trim();
            const telefono = document.getElementById('telefono-comprador').value.trim();

            if (seleccionados.length === 0) {
                alert('Por favor selecciona al menos un boleto.');
                return;
            }
            if (!nombre || !telefono) {
                alert('Por favor ingresa tu nombre y teléfono para registrar tus boletos.');
                return;
            }

            // Obtener el estado más reciente antes de guardar para evitar duplicados
            const { data: actual } = await supabase
                .from('rifa_datos')
                .select('vendidos, compradores')
                .eq('id', 1)
                .single();

            const vendidosActuales = actual?.vendidos || [];
            const compradoresActuales = actual?.compradores || [];

            // Verificar si algún boleto seleccionado ya fue comprado mientras se llenaba el formulario
            const conflicto = seleccionados.some(num => vendidosActuales.includes(num));
            if (conflicto) {
                alert('Uno o más boletos seleccionados acaban de ser comprados por otro usuario. Actualizando lista...');
                seleccionados = [];
                cargarDatos();
                return;
            }

            const nuevosVendidos = [...vendidosActuales, ...seleccionados];
            const nuevoRegistro = {
                nombre: nombre,
                telefono: telefono,
                boletos: [...seleccionados],
                fecha: new Date().toISOString()
            };
            const nuevosCompradores = [...compradoresActuales, nuevoRegistro];

            const { error } = await supabase
                .from('rifa_datos')
                .update({ 
                    vendidos: nuevosVendidos,
                    compradores: nuevosCompradores
                })
                .eq('id', 1);

            if (error) {
                alert('Hubo un error al procesar la compra.');
                console.error(error);
            } else {
                alert('¡Compra registrada con éxito!');
                seleccionados = [];
                document.getElementById('nombre-comprador').value = '';
                document.getElementById('telefono-comprador').value = '';
                cargarDatos();
            }
        }

        supabase
            .channel('public:rifa_datos')
            .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'rifa_datos' }, payload => {
                if (payload.new) {
                    boletosVendidos = payload.new.vendidos || [];
                    listaCompradores = payload.new.compradores || [];
                    // Limpiar de la selección actual si otro usuario compró el mismo número
                    seleccionados = seleccionados.filter(num => !boletosVendidos.includes(num));
                    generarBoletos();
                }
            })
            .subscribe();

        cargarDatos();
    </script>
</body>
</html>

<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>THE WIN - RIFA OFICIAL</title>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script type="text/javascript">

      emailjs.init("TU_PUBLIC_KEY"); 
    })();
  </script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800;900&display=swap');

    * { box-sizing: border-box; transition: all 0.25s ease; }
    body { 
      margin: 0; 
      background: radial-gradient(circle at top, #1a1500 0%, #050505 100%); 
      color: #fff; 
      font-family: 'Poppins', sans-serif; 
      min-height: 100vh;
    }

    .wrap { max-width: 500px; margin: auto; padding: 16px; position: relative; }

    .card { 
      border: 1px solid rgba(249, 226, 125, 0.3); 
      border-radius: 20px; 
      background: rgba(20, 20, 20, 0.85); 
      backdrop-filter: blur(10px);
      padding: 20px; 
      margin: 16px 0; 
      position: relative; 
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
    }

    .glow-gold {
      box-shadow: 0 0 20px rgba(197, 160, 40, 0.25);
      border-color: #F9E27D;
    }

    /* CONTENEDOR DE LA IMAGEN PRINCIPAL (MOTO) - Estilo exacto grande y sin recortes */
    .prize-img-container {
      width: 100%;
      height: 340px;
      border-radius: 16px;
      overflow: hidden;
      margin: 15px 0;
      border: 2px solid #C5A028;
      box-shadow: 0 0 15px rgba(197, 160, 40, 0.3);
      background: #0d0d0d;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
    }
    .prize-img-container img { 
      width: 100%; 
      height: 100%; 
      object-fit: contain; 
      object-position: center; 
      display: block;
    }

    /* GRILLA DE 2 FILAS Y 2 COLUMNAS (2 arriba y 2 abajo) */
    .prizes-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin: 15px 0;
    }
    .mini-prize-card {
      background: #151515;
      border: 1px solid #333;
      border-radius: 14px;
      overflow: hidden;
      text-align: center;
      padding-bottom: 10px;
    }
    .mini-prize-img {
      width: 100%;
      height: 100px;
      background: #222;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      color: #FFD700;
      font-weight: 600;
      padding: 5px;
      text-align: center;
      overflow: hidden;
    }
    .mini-prize-card img { 
      width: 100%; 
      height: 100%; 
      object-fit: cover; 
      object-position: center; 
      background: #222; 
    }
    .mini-prize-title { font-size: 12px; font-weight: 700; color: #FFD700; margin: 8px 5px 0; }

    /* LOGOTIPO */
    .logo-circle {
      width: 250px; 
      height: 250px; 
      margin: 0 auto 10px auto; 
      border-radius: 50%; 
      background: linear-gradient(135deg, #FFD700, #FF8C00); 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      box-shadow: 0 0 30px rgba(255,215,0,0.6); 
      overflow: hidden;
      border: 3px solid #FFD700; 
    }
    .logo-circle img { 
      width: 100%; 
      height: 100%; 
      object-fit: cover; 
      object-position: center;
      display: block;
    }

    .bar { background: #1a1a1a; height: 26px; border-radius: 20px; overflow: hidden; position: relative; border: 1px solid #333; }
    .fill { height: 100%; background: linear-gradient(90deg, #FFD700, #FF5722, #E91E63); width: 0%; transition: width 0.8s ease; box-shadow: 0 0 15px #FFD700; }

    .pkg-card {
      background: linear-gradient(145deg, #151515, #0a0a0a);
      border: 2px solid #C5A028; border-radius: 24px; padding: 20px;
      text-align: center; margin-bottom: 18px; position: relative; cursor: pointer;
    }
    .pkg-card:hover { transform: translateY(-4px) scale(1.02); box-shadow: 0 10px 25px rgba(197, 160, 40, 0.4); }
    .pkg-card.popular {
      background: linear-gradient(135deg, #ffffff 0%, #f0f0f0 100%); color: #000;
      border: 3px solid #00E5FF; box-shadow: 0 0 25px rgba(0, 229, 255, 0.4);
    }
    .badge-popular {
      position: absolute; top: 15px; right: -25px; background: linear-gradient(90deg, #00E5FF, #0088FF);
      color: #fff; font-size: 10px; font-weight: 900; padding: 4px 28px; transform: rotate(45deg);
      text-transform: uppercase; letter-spacing: 1px; box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
    .pkg-tickets { font-size: 32px; font-weight: 900; color: #F9E27D; }
    .pkg-card.popular .pkg-tickets { color: #000; }
    .pkg-price { font-size: 36px; font-weight: 900; margin: 5px 0; background: linear-gradient(90deg, #FFD700, #FFA500); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .pkg-card.popular .pkg-price { -webkit-text-fill-color: initial; color: #000; }

    .grid { 
      display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; 
      max-height: 280px; overflow-y: auto; background: #080808; padding: 12px; 
      border-radius: 16px; border: 1px solid #222; 
    }
    .num { 
      border: 1px solid #333; height: 42px; display: flex; align-items: center; 
      justify-content: center; font-size: 12px; font-weight: 800; background: #141414; 
      border-radius: 10px; user-select: none; color: #777; 
    }
    .num.sel { background: linear-gradient(135deg, #00E676, #1DE9B6); color: #000; font-weight: 900; border: none; box-shadow: 0 0 12px rgba(0, 230, 118, 0.8); }

    .btn { 
      width: 100%; padding: 18px; border: none; border-radius: 16px; font-weight: 900; 
      background: linear-gradient(90deg, #FFD700, #FFA500); color: #000; font-size: 16px; 
      cursor: pointer; margin-top: 12px; letter-spacing: 0.5px; box-shadow: 0 5px 15px rgba(255, 165, 0, 0.3); 
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(255, 165, 0, 0.5); }
    .btn:disabled { background: #333 !important; color: #777 !important; cursor: not-allowed !important; box-shadow: none !important; transform: none !important; }
    .btn-pkg { width: 100%; padding: 12px; border-radius: 20px; border: none; font-weight: 900; font-size: 14px; cursor: pointer; background: linear-gradient(90deg, #FFD700, #FFA500); color: #000; }
    .pkg-card.popular .btn-pkg { background: #000; color: #fff; }
    .btn-sec { background: #222; color: #ccc; border: 1px solid #444; box-shadow: none; }
    .btn-sec:hover { background: #333; color: #fff; }

    .form-group { margin-bottom: 14px; }
    .form-row { display: flex; gap: 10px; }
    .form-row .form-group { flex: 1; }
    label { font-size: 12px; color: #bbb; display: block; margin-bottom: 6px; font-weight: 600; }
    label span { color: #ff4d4d; }
    input, select { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid #333; background: #111; color: #fff; font-size: 14px; outline: none; font-family: inherit; }

    .pago-card { 
      background: #151515; border: 1px solid #333; border-radius: 16px; 
      padding: 16px; margin-bottom: 15px; position: relative; 
    }
    .pago-card.highlight { border-color: #FFD700; box-shadow: 0 0 15px rgba(255,215,0,0.15); }
    .pago-header { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
    .pago-details { font-size: 13px; color: #ddd; background: #0d0d0d; padding: 10px; border-radius: 10px; border: 1px dashed #444; }
    .hidden { display: none !important; }

    .wheel-container { position: relative; text-align: center; margin: 20px 0; display: inline-block; }
    #wheel { border: 4px solid #FFD700; border-radius: 50%; box-shadow: 0 0 25px rgba(255, 215, 0, 0.5); transition: transform 2s cubic-bezier(0.15, 0.9, 0.2, 1); }
    .wheel-pointer { width: 0; height: 0; border-left: 14px solid transparent; border-right: 14px solid transparent; border-top: 22px solid #FF3366; position: absolute; top: -10px; left: 50%; transform: translateX(-50%); z-index: 10; }
    
    .number-boom {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0);
      background: rgba(0, 0, 0, 0.95); border: 3px solid #00E676; color: #00E676;
      font-size: 28px; font-weight: 900; padding: 12px 24px; border-radius: 16px;
      box-shadow: 0 0 30px #00E676; z-index: 20; transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .number-boom.show { transform: translate(-50%, -50%) scale(1.2); }

    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 12px; text-align: left; }
    th, td { border: 1px solid #333; padding: 8px; vertical-align: middle; }
    th { background: #222; color: #FFD700; }
    
    .file-input-wrapper {
      position: relative;
      background: #181818;
      border: 2px dashed #FFD700;
      border-radius: 14px;
      padding: 15px;
      text-align: center;
      cursor: pointer;
      margin-top: 10px;
    }
    .file-input-wrapper input[type="file"] {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      opacity: 0;
      cursor: pointer;
    }
    .preview-img {
      max-width: 100%;
      max-height: 120px;
      border-radius: 10px;
      margin-top: 10px;
      border: 1px solid #444;
      display: none;
    }
  </style>
</head>
